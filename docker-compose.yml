services:
  # Next.js production server
  web:
    build:
      context: ./concert-tracker
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount shared database directory (read-only for safety)
      - ./data:/app/data:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/concerts.db
      - PRISMA_QUERY_ENGINE_LIBRARY=/app/node_modules/.prisma/client/libquery_engine-linux-musl-openssl-3.0.x.so.node
      - PRISMA_QUERY_ENGINE_BINARY=/app/node_modules/.prisma/client/query-engine-linux-musl-openssl-3.0.x
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
