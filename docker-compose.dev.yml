services:
  # MySQL database
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./data/db:/var/lib/mysql
      - ./concert-tracker/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js development server
  web:
    init: true
    build:
      context: ./concert-tracker
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload (includes scripts directory)
      - ./concert-tracker:/app
      # Mount shared database directory (for backups/exports)
      - ./data:/app/data
      # Mount .env for configuration
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=development
      - DB_TYPE=${DB_TYPE:-mysql}
      - DATABASE_URL=${DATABASE_URL:-mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-file:/app/data/concerts.db}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_USER=${LASTFM_USER}
      - FANART_API_KEY=${FANART_API_KEY}
      - WATCHPACK_POLLING=true
    command: sh scripts/startup.sh
    user: "1000:1000"
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
