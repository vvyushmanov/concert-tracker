# Dev stack: hot reload, otherwise mirrors docker-compose.yml (same MariaDB image
# + profile + limits, same Node/Python base, same env contract). Only the web
# server differs: `next dev` instead of the standalone build, and no mem_limit
# (the dev compiler needs far more than prod's 512 MB). To test the real prod
# image next to it: WEB_PORT=3001 docker compose up -d --build
name: concert-tracker-dev

x-logging: &logging
  driver: local
  options:
    max-size: 5m
    max-file: "2"

services:
  # MariaDB database
  db:
    # Same engine + low-memory profile as production (docker-compose.yml)
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      # init-db.sh reads the MYSQL_* names
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    ports:
      - "3306:3306"
    volumes:
      # ./data/db holds the old MySQL 8.0 datadir — MariaDB can't open it, so
      # it gets its own; import a dump once (see README "Database")
      - ./data/mariadb:/var/lib/mysql
      - ./concert-tracker/scripts/mariadb.cnf:/etc/mysql/conf.d/zz-low-memory.cnf:ro
      - ./concert-tracker/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging: *logging

  # Next.js development server
  web:
    init: true
    build:
      context: ./concert-tracker
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload (includes scripts directory)
      - ./concert-tracker:/app
      # Mount shared database directory (for backups/exports)
      - ./data:/app/data
      # Mount .env for configuration
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - LASTFM_USER=${LASTFM_USER}
      - FANART_API_KEY=${FANART_API_KEY}
      - COUNTRY_CODES=${COUNTRY_CODES:-}
      - WEBSHARE_PROXY_URL=${WEBSHARE_PROXY_URL:-}
      # As in prod: secret from env, any Host trusted (LAN/Tailscale testing)
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      # Bearer token for POST /api/ingest (desktop scraper agent). Read by the
      # Next.js process env here — the mounted /app/.env is only seen by Python's
      # load_dotenv, not Node, so this MUST be in the environment block.
      - INGEST_TOKEN=${INGEST_TOKEN}
      - WATCHPACK_POLLING=true
    command: sh scripts/startup.sh
    user: "1000:1000"
    stdin_open: true
    tty: true
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
